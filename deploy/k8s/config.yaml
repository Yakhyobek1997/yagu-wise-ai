# Non-secret configuration shared across YaguWiseAi services. In k8s, services
# resolve each other by their Service DNS name (yaguwiseai-qdrant, yaguwiseai-api, …),
# so the rootless-CNI workarounds from the compose stack are unnecessary here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yaguwiseai-config
  namespace: yaguwiseai
  labels:
    app.kubernetes.io/part-of: yaguwiseai
data:
  YAGUWISEAI_ENV: "prod"
  YAGUWISEAI_LOG_LEVEL: "INFO"
  YAGUWISEAI_LOG_JSON: "true"
  YAGUWISEAI_DATA_DIR: "/app/data"
  # In-cluster service-name addressing (k8s DNS).
  YAGUWISEAI_VECTOR__URL: "http://yaguwiseai-qdrant:6333"
  YAGUWISEAI_VECTOR__BACKEND: "qdrant"
  YAGUWISEAI_TELEMETRY__OTLP_ENDPOINT: "http://yaguwiseai-phoenix:4317"
  YAGUWISEAI_LLM__PROVIDER: "auto"
  YAGUWISEAI_MCP_HOST: "0.0.0.0"
  YAGUWISEAI_MCP_PORT: "8765"
  # The web /api proxy forwards to the API Service.
  YAGUWISEAI_API_INTERNAL: "http://yaguwiseai-api:8000"
---
# Secret TEMPLATE — DO NOT COMMIT REAL VALUES. Create the real Secret out-of-band:
#   kubectl -n yaguwiseai create secret generic yaguwiseai-secrets \
#     --from-literal=YAGUWISEAI_SERVE__API_KEY=... \
#     --from-literal=COHERE_API_KEY=... [--from-literal=OPENAI_API_KEY=... ...]
# Every secret is optional except where a feature requires it; missing keys
# degrade to the offline fallbacks (ADR-0003). This stub keeps `kubectl apply -k`
# working before real secrets are provisioned (all values empty).
apiVersion: v1
kind: Secret
metadata:
  name: yaguwiseai-secrets
  namespace: yaguwiseai
  labels:
    app.kubernetes.io/part-of: yaguwiseai
type: Opaque
stringData:
  YAGUWISEAI_SERVE__API_KEY: ""
  YAGUWISEAI_MCP_API_KEY: ""
  HUGGINGFACE_TOKEN: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  COHERE_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
